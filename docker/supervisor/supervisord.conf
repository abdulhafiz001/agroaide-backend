[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Laravel 11+/12 scheduler — keeps running inside the container (Coolify-safe).
# Runs: detect-outbreaks (hourly), send-task-reminders (30m),
#       send-weather-alerts (2h), send-daily-ai-insights (06:30)
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Database-backed diagnosis/evaluation queues. Keep timeout above the longest job
# timeout and deploy with `php artisan migrate --force` before workers restart.
[program:queue-worker]
command=php /var/www/html/artisan queue:work database --queue=diagnosis,evaluation,default --sleep=2 --tries=3 --timeout=3700 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3710
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
